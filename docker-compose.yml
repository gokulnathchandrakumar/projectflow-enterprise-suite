services:
  mysql:
    image: mysql:8.4
    container_name: projectflow_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-projectflow_db}
      MYSQL_USER: ${MYSQL_USER:-projectflow_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-projectflow_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: projectflow_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL:-mysql://projectflow_user:projectflow_password@mysql:3306/projectflow_db}
      JWT_SECRET: ${JWT_SECRET:-replace-with-secure-jwt-secret-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: http://localhost:3000,http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
